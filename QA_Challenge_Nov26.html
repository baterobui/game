<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xoai QA Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FC; --surface:#FFFFFF; --ink:#1A1F36; --muted:#5B6280; --line:#DCE0EF;
  --pink:#FF4F8B; --mint:#14B89A; --sun:#FFC93C; --field:#F8F9FE;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#131729;--surface:#1C2138;--ink:#EEF0FA;--muted:#A3A9C6;--line:#2E3554;--pink:#FF6B9E;--mint:#2FD6B6;--sun:#FFD25E;--field:#161A2E;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#131729;--surface:#1C2138;--ink:#EEF0FA;--muted:#A3A9C6;--line:#2E3554;--pink:#FF6B9E;--mint:#2FD6B6;--sun:#FFD25E;--field:#161A2E;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16.5px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:Fredoka,"Be Vietnam Pro",system-ui,sans-serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(1.9rem,6.5vw,2.8rem);font-weight:700}
h2{font-size:1.6rem;font-weight:600}
h3{font-size:1.2rem;font-weight:600}
p{margin:0 0 1em}
a{color:var(--pink)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 80px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.logo{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.05rem}
.bar-r{display:flex;gap:12px;align-items:center}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.lang{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:inherit;font-size:.85rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:3px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.steps button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.steps button[aria-current="step"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.steps button.done{border-color:var(--mint);color:var(--mint)}
.steps button:disabled{opacity:.45;cursor:not-allowed}
section.step{display:none;padding-top:24px}
section.step.on{display:block}
.welcome{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:center;padding:28px 0 20px}
.welcome img{width:100%;max-width:220px;height:auto;aspect-ratio:1/1;object-fit:contain;border-radius:28px;background:#fff;justify-self:center}
@media (max-width:560px){.welcome{grid-template-columns:1fr}.welcome img{max-width:200px;order:-1}}
.tag{display:inline-block;background:var(--sun);color:#1A1F36;font-family:Fredoka,sans-serif;font-weight:600;border-radius:8px;padding:2px 10px;transform:rotate(-2deg);margin-bottom:14px}
.lead{font-size:1.05rem;color:var(--muted);max-width:60ch}
.q{margin:0 0 28px}
.q label,.q .qt{display:block;font-weight:700;margin-bottom:6px}
.q .hint{display:block;color:var(--muted);font-size:.92rem;margin:-2px 0 8px}
textarea,input[type=text],input[type=url],select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:100px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible,canvas:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.choices{display:grid;gap:8px}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
@media (max-width:520px){.choices.row{grid-template-columns:1fr}}
.choices label{display:flex;gap:10px;align-items:flex-start;font-weight:400;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.choices input{margin-top:6px;accent-color:var(--pink)}
.gname{font-weight:700;display:block}
.gdesc{display:block;color:var(--muted);font-size:.92rem}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.pink{background:var(--pink);color:#fff}
.brief{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:20px}
.brief p:last-child{margin:0}
.feel{border-top:2px solid var(--line);padding-top:22px}
.feel-n{font-family:Fredoka,sans-serif;font-weight:600;color:var(--pink)}
.arcs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.arcs figure{margin:0;text-align:center}
.arcs canvas{width:min(150px,27vw);height:auto;aspect-ratio:1/1;border-radius:16px;background:var(--field);border:2px solid var(--line);display:block}
.arcs figcaption{font-family:Fredoka,sans-serif;font-weight:600;margin-top:4px}
.part{margin:40px 0 18px}
.countdown{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.countdown.low{color:var(--pink)}
.game-zone{display:grid;gap:12px;justify-items:center;margin:8px 0 24px}
.game-zone canvas{width:100%;max-width:340px;aspect-ratio:680/906;border-radius:22px;touch-action:manipulation;display:none;box-shadow:0 0 0 3px var(--ink)}
.game-zone canvas.on{display:block}
.closed{border:2px solid var(--pink);border-radius:16px;padding:16px 18px;margin-bottom:24px}
.stats{color:var(--muted);font-size:.9rem;text-align:center}
.buglog{border:2px dashed var(--line);border-radius:16px;padding:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.bug{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--surface)}
.bug .meta{font-size:.85rem;color:var(--muted)}
.bug button{float:right;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline}
pre{white-space:pre-wrap;background:var(--field);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:.85rem;max-height:420px;overflow:auto}
.hidden{display:none !important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

  <span class="logo" data-i18n="logo"></span>

</div></header>

var XK='xoai';
function encodeRef(){

  function colorFor(i){if(i===7)return '#D6DCF0';return 'hsl('+((i*29+330)%360)+',78%,58%)';}
  function speedFor(s){return s>10?820:230+s*16;}
  function spawn(){var top=G.blocks[G.blocks.length-1];G.cur={x:0,w:top.w,dir:1,c:colorFor(G.blocks.length)};}
  function reset(){G.blocks=[{x:(W-360)/2,w:360,c:colorFor(0)}];G.over=false;G.running=true;G.speed=speedFor(G.score);spawn();P.r++;save();}
  function drop(){var now=performance.now();if(now-G.lastTap<150)G.score++;G.lastTap=now;
    var top=G.blocks[G.blocks.length-1],c=G.cur,l=Math.max(c.x,top.x),r=Math.min(c.x+c.w,top.x+top.w),ov=r-l;
    if(ov<=0){G.running=false;G.over=true;G.best=G.score;return;}
    if(Math.abs(c.x-top.x)<8){c.x=top.x;G.perfectT=now;}else{c.x=l;c.w=ov;}
    G.blocks.push({x:c.x,w:c.w,c:c.c});G.score++;if(G.score>P.max)P.max=G.score;G.speed=speedFor(G.score);spawn();}
  G.blocks=[{x:(W-360)/2,w:360,c:colorFor(0)}];
  return {cv:cv,tap:function(){if(!G.running)reset();else drop();},resume:function(){},
    frame:function(tm,paused){
      if(!paused){if(G.last===null)G.last=tm;var dt=(tm-G.last)/1000;G.last=tm;
        if(G.running){P.s+=Math.min(dt,.05);var c=G.cur;c.x+=c.dir*G.speed*dt;if(c.x+c.w>W){c.x=W-c.w;c.dir=-1;}if(c.x<0){c.x=0;c.dir=1;}}}
      x.fillStyle=BG;x.fillRect(0,0,W,H);
      var n=G.blocks.length,base=H-120,off=Math.max(0,n-12)*BH;
      for(var i=0;i<n;i++){var b=G.blocks[i],y=base-i*BH+off;if(y<-BH)continue;x.fillStyle=b.c;x.fillRect(b.x,y,b.w,BH-4);}
      if(G.running){x.fillStyle=G.cur.c;x.fillRect(G.cur.x,base-n*BH+off,G.cur.w,BH-4);}
      hud(x,String(G.score),'Best '+G.best);
      if(tm-G.perfectT<700&&G.running){x.fillStyle='#FF4F8B';x.font='700 46px Fredoka, sans-serif';x.fillText('Perfect x1',W/2,230);}
      if(!G.running){if(G.over)overlay(x,'Game over','Tap to try agian');else overlay(x,'Stack Up','Tap to start');}
      if(paused)pausedOverlay(x);
    }};
})();

var knife=(function(){
  var cv=$('cv_knife'),x=cv.getContext('2d'),CX=W/2,CY=330,R=130;
  var G={stage:1,stuck:[],left:0,rot:0,dir:1,flip:0,fly:null,running:false,over:false,clearT:0,last:null,hits:0};
  function norm(a){a=a%TAU;if(a>Math.PI)a-=TAU;if(a<=-Math.PI)a+=TAU;return a;}
  function startStage(){G.stuck=[];for(var i=0;i<G.stage-1;i++)G.stuck.push(Math.random()*TAU);G.left=6+G.stage;G.fly=null;G.flip=0;G.dir=1;if(G.stage>P.max){P.max=G.stage;save();}}
  function reset(){G.stage=1;G.hits=0;G.over=false;G.running=true;startStage();P.r++;save();}
  function spd(){return G.stage===1?1.6:G.stage===2?2.2:4.6;}
  function drawKnife(wa){var dx=Math.cos(wa),dy=Math.sin(wa);x.lineCap='round';
    x.strokeStyle='#C9CED9';x.lineWidth=12;x.beginPath();x.moveTo(CX+dx*(R-28),CY+dy*(R-28));x.lineTo(CX+dx*(R+50),CY+dy*(R+50));x.stroke();
    x.strokeStyle='#3A2F5B';x.lineWidth=16;x.beginPath();x.moveTo(CX+dx*(R+50),CY+dy*(R+50));x.lineTo(CX+dx*(R+105),CY+dy*(R+105));x.stroke();}
  return {cv:cv,tap:function(){if(!G.running){reset();return;}if(G.clearT>0||G.left<=0)return;G.fly={y:H-180};},resume:function(){G.last=null;},
    frame:function(tm,paused){
      if(!paused){if(G.last===null)G.last=tm;var dt=Math.min((tm-G.last)/1000,.05);G.last=tm;
        if(G.running){P.s+=dt;
          if(G.stage>=3){G.flip+=dt;if(G.flip>1.5){G.flip=0;G.dir*=-1;}}
          G.rot+=G.dir*spd()*dt;
          if(G.clearT>0){G.clearT-=dt;if(G.clearT<=0){G.stage++;startStage();}}
          if(G.fly){G.fly.y-=2600*dt;
            if(G.fly.y<=CY+R){var local=norm(Math.PI/2-G.rot),hit=false;
              for(var i=0;i<G.stuck.length;i++){var d=norm(local-G.stuck[i]);if(d>-0.05&&d<0.2){hit=true;break;}}
              G.fly=null;
              if(hit){G.running=false;G.over=true;}
              else{G.stuck.push(local);G.left--;G.hits++;if(G.left<=0)G.clearT=1;}}}}}
      x.fillStyle='#F3E9DA';x.fillRect(0,0,W,H);
      hud(x,'Stage '+G.stage,'Knives: '+Math.max(0,G.left-1));
      for(var i=0;i<G.stuck.length;i++)drawKnife(G.stuck[i]+G.rot);
      x.fillStyle='#B7794A';x.beginPath();x.arc(CX,CY,R,0,TAU);x.fill();
      x.strokeStyle='#8F5A33';x.lineWidth=6;x.beginPath();x.arc(CX,CY,R*.62,0,TAU);x.stroke();x.beginPath();x.arc(CX,CY,R*.28,0,TAU);x.stroke();
      x.save();x.translate(CX,CY);x.rotate(G.rot);x.fillStyle='#8F5A33';x.fillRect(-6,-R+10,12,30);x.restore();
      if(G.running&&G.left>0&&G.clearT<=0){var ky=G.fly?G.fly.y:H-180;x.lineCap='round';x.strokeStyle='#C9CED9';x.lineWidth=12;x.beginPath();x.moveTo(CX,ky);x.lineTo(CX,ky+78);x.stroke();x.strokeStyle='#3A2F5B';x.lineWidth=16;x.beginPath();x.moveTo(CX,ky+78);x.lineTo(CX,ky+133);x.stroke();}
      if(G.clearT>0){x.fillStyle='#14B89A';x.textAlign='center';x.font='700 54px Fredoka, sans-serif';x.fillText('Level complete!',W/2,H-90);}
      if(!G.running){if(G.over)overlay(x,'Game over','Knives hit '+G.hits+' · Tap to retry');else overlay(x,'Knife Spin','Tap to start');}
      if(paused)pausedOverlay(x);
    }};
})();

var bird=(function(){
  var cv=$('cv_bird'),x=cv.getContext('2d'),BX=200,DR=26,HR=42,GAP=270,PW=110,GROUND=H-90;
  var G={y:H/2,vy:0,pipes:[],score:0,best:0,running:false,over:false,spawnT:0,count:0,last:null};
  function reset(){G.y=H/2;G.vy=0;G.score=0;G.spawnT=0;G.over=false;G.running=true;G.pipes=G.pipes.filter(function(p){return p.x>BX+HR+60;});P.r++;save();}
  function die(){G.running=false;G.over=true;if(G.score>G.best)G.best=G.score;}
  return {cv:cv,tap:function(){if(!G.running)reset();G.vy=-11;},resume:function(){G.last=null;},
    frame:function(tm,paused){
      if(!paused){if(G.last===null)G.last=tm;var dt=Math.min((tm-G.last)/1000,.05);G.last=tm;
        if(G.running){P.s+=dt;
          G.vy+=0.6;G.y+=G.vy;
          G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=1.6;G.count++;var gap=G.count%9===0?105:GAP;var top=120+Math.random()*(GROUND-240-gap);G.pipes.push({x:W+20,top:top,bot:top+gap,passed:false});}
          for(var i=0;i<G.pipes.length;i++){var p=G.pipes[i];p.x-=270*dt;
            if(!p.passed&&p.x+PW<BX){p.passed=true;G.score++;if(G.score>P.max)P.max=G.score;}
            if(BX+HR>p.x&&BX-HR<p.x+PW){if((G.y>0&&G.y-HR<p.top)||G.y+HR>p.bot)die();}}
          G.pipes=G.pipes.filter(function(p){return p.x>-PW-20;});
          if(G.y+DR>GROUND)die();}}
      x.fillStyle='#BFE7F2';x.fillRect(0,0,W,H);
      G.pipes.forEach(function(p){x.fillStyle='#5BBF6A';x.fillRect(p.x,0,PW,p.top);x.fillRect(p.x,p.bot,PW,GROUND-p.bot);x.fillStyle='#3E9E50';x.fillRect(p.x-8,p.top-26,PW+16,26);x.fillRect(p.x-8,p.bot,PW+16,26);});
      x.fillStyle='#E8C77A';x.fillRect(0,GROUND,W,H-GROUND);
      var ang=Math.max(-.5,Math.min(1,G.vy/18));x.save();x.translate(BX,G.y);x.rotate(ang);
      x.fillStyle='#FFC93C';x.beginPath();x.arc(0,0,DR,0,TAU);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(9,-8,8,0,TAU);x.fill();x.fillStyle='#1A1F36';x.beginPath();x.arc(11,-8,4,0,TAU);x.fill();
      x.fillStyle='#FF7A3C';x.beginPath();x.moveTo(20,0);x.lineTo(38,6);x.lineTo(20,12);x.fill();x.restore();
      hud(x,String(G.score),'Best '+G.best);
      if(!G.running){if(G.over)overlay(x,'Game over','Tap to fly again');else overlay(x,'Hop Bird','Tap to start');}
      if(paused)pausedOverlay(x);
    }};
})();

var games={stack:stack,knife:knife,bird:bird},paused=false;
Object.keys(games).forEach(function(k){var g=games[k];
  g.cv.addEventListener('pointerdown',function(e){e.preventDefault();if(!paused&&huntLeft()>0)g.tap();});
  g.cv.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();if(!paused&&huntLeft()>0)g.tap();}});
});
$('pauseBtn').addEventListener('click',function(){paused=!paused;$('pauseBtn').textContent=paused?t('resume'):t('pause');if(!paused&&S.chosen)games[S.chosen].resume();});
var lastSave=0;
function loop(tm){
  if(S.chosen&&sections[2].classList.contains('on')&&huntLeft()>0){games[S.chosen].frame(tm,paused);if(tm-lastSave>1000){lastSave=tm;save();}}
  else if(S.chosen){games[S.chosen].resume();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

applyLang();
show(S.started?Math.min(S.step,sections.length-1):0);
})();
</script>
